<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17365d">
  <title>Schlüssel gefunden?</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f2f5f9; color: #172033;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 460px); padding: 34px 26px; text-align: center;
      background: #fff; border-radius: 24px;
      box-shadow: 0 12px 40px rgba(20, 40, 70, .10);
    }
    .symbol { font-size: 52px; line-height: 1.2; margin-bottom: 14px; }
    h1 { margin: 0 0 18px; color: #17365d; font-size: clamp(2rem, 8vw, 2.7rem); }
    p { margin: 0 auto 24px; font-size: 1.12rem; line-height: 1.6; }
    .phone { display: block; margin: 0 0 20px; color: #17365d; font-size: clamp(1.55rem, 6vw, 2rem); font-weight: 750; text-decoration: none; }
    a.call {
      display: block; padding: 17px 22px; border-radius: 14px;
      background: #176b45; color: white; text-decoration: none;
      font-size: 1.15rem; font-weight: 700;
    }
    .small { margin: 20px 0 0; color: #657087; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">🔑</div>
    <h1>Schlüssel gefunden?</h1>
    <p>Danke, dass Du mir hilfst, meinen Schlüssel wiederzuerlangen!</p>
    <a class="phone" href="tel:+4915170659181">+49 151 70659181</a>
    <a class="call" href="tel:+4915170659181">Jetzt anrufen</a>
    <p class="small">Vielen Dank für Deine Hilfe!</p>
  </main>
</body>
</html>
